server.port=${SERVER_PORT:8080}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
spring.jackson.default-property-inclusion=always
app.registros-service.url=${REGISTROS_SERVICE_URL:http://localhost:8081}
spring.datasource.url=${NOTIFICATIONS_DATABASE_URL:jdbc:h2:file:./data/notifications;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notifications.email.from=${NOTIFICATIONS_EMAIL_FROM:}
notifications.email.base-url=${NOTIFICATIONS_BASE_URL:http://localhost:8080}
notifications.digest.cron=${NOTIFICATIONS_DIGEST_CRON:0 0 9 * * *}
notifications.digest.zone=${NOTIFICATIONS_DIGEST_ZONE:Europe/Madrid}
spring.cache.caffeine.spec=expireAfterWrite=5m,maximumSize=1
