server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portabilidades}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:portabilidades}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:portabilidades}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.h2.console.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
spring.jackson.default-property-inclusion=always
app.data.path=${APP_DATA_PATH:}
