services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portabilidades
      POSTGRES_USER: ${POSTGRES_USER:-portabilidades}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portabilidades}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d portabilidades"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  registros-service:
    build:
      context: .
      dockerfile: registros-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portabilidades
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-portabilidades}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-portabilidades}
      APP_DATA_PATH: /app/data/ds_24475_1.csv
    volumes:
      - type: bind
        source: ${APP_DATA_FILE:-./registros-service/src/main/resources/ds_24475_1.csv}
        target: /app/data/ds_24475_1.csv
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8081"
    restart: unless-stopped

  analiticas-service:
    build:
      context: .
      dockerfile: analiticas-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      REGISTROS_SERVICE_URL: http://registros-service:8081
      NOTIFICATIONS_DATABASE_URL: "jdbc:h2:file:./data/notifications;DB_CLOSE_ON_EXIT=FALSE"
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_USERNAME: ${BREVO_SMTP_USERNAME:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
      NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM:-}
      NOTIFICATIONS_BASE_URL: ${NOTIFICATIONS_BASE_URL:-http://localhost:8080}
      NOTIFICATIONS_DIGEST_CRON: ${NOTIFICATIONS_DIGEST_CRON:-0 0 9 * * *}
      NOTIFICATIONS_DIGEST_ZONE: ${NOTIFICATIONS_DIGEST_ZONE:-Europe/Madrid}
    volumes:
      - analiticas-data:/app/data
    depends_on:
      - registros-service
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  analiticas-data:
