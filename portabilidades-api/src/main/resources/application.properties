# Configuración de Servidor
server.port=8080

# Configuración de H2 Database
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./portabilidades-db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.operations-sorter= method
swagger-ui:
    path: /swagger-ui.html

# SMTP de Brevo. Configura BREVO_SMTP_USERNAME, BREVO_SMTP_KEY y NOTIFICATIONS_EMAIL_FROM.
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notifications.email.from=${NOTIFICATIONS_EMAIL_FROM:}
notifications.email.base-url=${NOTIFICATIONS_BASE_URL:http://localhost:8080}
notifications.digest.cron=${NOTIFICATIONS_DIGEST_CRON:0 0 9 * * *}
notifications.digest.zone=${NOTIFICATIONS_DIGEST_ZONE:Europe/Madrid}

# Serialización JSON: incluir campos nulos explícitamente como null
spring.jackson.default-property-inclusion=always

